[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hash routing means every request is for "/", but keep this so a stray deep
# link still lands on the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The camera is the whole point; allow it on our own origin.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
